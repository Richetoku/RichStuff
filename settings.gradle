pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'RichStuff'

def richCoreDir = file('../RichCore')
if (!richCoreDir.isDirectory()) {
    throw new GradleException('RichCore must remain beside this module for standalone development: ' + richCoreDir)
}
include(':richcore')
project(':richcore').projectDir = richCoreDir
