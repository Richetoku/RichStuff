[rich_omniwrench]
	#Maximum complete tool stacks stored in one Rich Omniwrench.
	# Default: 64
	# Range: 1 ~ 128
	maximumStoredTools = 64
	#Allow duplicate tool stacks.
	allowDuplicateTools = false
	#Allow a fully broken selected tool to remain selectable.
	allowBrokenToolSelection = false

[debug]
	#Developer compatibility mode. Enabled by default: replaces vanilla base-ore generation and bypasses mob-capture restrictions.
	enabled = true
