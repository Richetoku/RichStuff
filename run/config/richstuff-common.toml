[processing]
	#Enable budding RichStuff crystal blocks to grow crystal blocks in adjacent air.
	enableCrystalGrowth = true
	#Generated Create recipe JSON is gated with a create mod_loaded condition.
	createRecipesRequireCreate = true
	#Enable direct vanilla crafting/smelting shortcuts. Disabled by default so materials must use the processing chain or powered machines.
	enableVanillaFallbackRecipes = false

[metal_slimes]
	#Enable colored RichStuff metal slimes that drop matching metal nuggets.
	enableMetalSlimes = true
	#Global multiplier applied to metal slime spawn-rule chances. Biome modifier weights remain data-pack controlled.
	# Default: 1.0
	# Range: 0.0 ~ 64.0
	metalSlimeSpawnMultiplier = 1.0

#Rich Gear accepts every RichStuff material family. Levels are earned by use; every five levels unlocks another material modifier slot.
[native_rich_gear]
	#Maximum effective Rich Gear level. Existing higher-level data is retained but operates at this cap.
	# Default: 10
	# Range: 1 ~ 1000
	maximumLevel = 10
	#Minimum durability restored by one matching primary-material item.
	# Default: 1
	# Range: 0 ~ 1000000
	repairAmount = 1
	#Fraction of maximum durability restored by one matching primary-material item. The larger of this and repairAmount is used.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	repairPercent = 0.25

#Rich Tank capacities and Foundry shared storage, measured in millibuckets.
[rich_tanks_and_foundry]
	#Base shared molten-fluid capacity of a completed Foundry before Rich Tanks are counted.
	# Default: 12960
	# Range: > 1000
	foundryBaseCapacity = 12960
	#Rich Tank item stacks retain their standalone fluid contents when broken.
	retainTankFluidWhenBroken = true
	#Capacity of Rich Tank tier 1.
	# Default: 8000
	# Range: > 1000
	richTank1Capacity = 8000
	#Capacity of Rich Tank tier 2.
	# Default: 16000
	# Range: > 1000
	richTank2Capacity = 16000
	#Capacity of Rich Tank tier 3.
	# Default: 32000
	# Range: > 1000
	richTank3Capacity = 32000
	#Capacity of Rich Tank tier 4.
	# Default: 64000
	# Range: > 1000
	richTank4Capacity = 64000
	#Capacity of Rich Tank tier 5.
	# Default: 128000
	# Range: > 1000
	richTank5Capacity = 128000
	#Capacity of Rich Tank tier 6.
	# Default: 256000
	# Range: > 1000
	richTank6Capacity = 256000
	#Capacity of Rich Tank tier 7.
	# Default: 512000
	# Range: > 1000
	richTank7Capacity = 512000
