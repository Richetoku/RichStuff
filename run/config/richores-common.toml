[replacement]
	#Master switch for all opt-in vanilla replacement categories.
	#Disabled by default. Category switches have no effect until this is enabled.
	enabled = false
	#Replace vanilla ore generation with RichOres generation.
	#Disabled by default. Enable it to suppress vanilla ore features and use the matching RichOres variants.
	replaceVanillaOreGeneration = false
	#Replace ore, gem, and crystal generation supplied by other namespaces.
	#Disabled by default so installing RichOres never silently removes another mod's world generation.
	replaceModdedOreGeneration = false
	#Replace vanilla ore block item outputs with matching RichOres host variants.
	replaceVanillaOreItems = false
	#Replace vanilla redstone/glowstone dust outputs with RichStuff forms when RichStuff is installed.
	replaceVanillaDustItems = false
	#Replace vanilla metal ingot outputs with RichStuff forms when RichStuff is installed.
	replaceVanillaIngotItems = false
	#Replace vanilla material storage block item outputs with RichStuff forms when RichStuff is installed.
	replaceVanillaStorageBlockItems = false

[worldgen]
	#Master switch for every RichOres JSON-driven ore generation pass.
	enableWorldgen = true
	#Allow suppression.json and the replacement switches to remove registered ore, gem, and crystal generation features.
	enableExternalOreSuppression = true
	#Create missing JSON configuration files in config/richores/worldgen.
	createMissingJsonDefaults = true
	#Log loaded JSON definitions and suppression decisions at startup.
	logLoadedWorldgen = true

